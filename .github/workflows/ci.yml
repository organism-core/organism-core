name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Run cross-domain demo verification
        run: pytest tests/examples/test_cross_demo.py -v

  demo-smoketest:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run architect_lite demo
        run: python -m examples.architect_lite

      - name: Run tax_lite demo
        run: python -m examples.tax_lite

      - name: Run cfo_lite demo
        run: python -m examples.cfo_lite

      - name: Run full_recherche demo
        run: python -m examples.full_recherche

      - name: Run cockpit_demo
        run: python -m examples.cockpit_demo
